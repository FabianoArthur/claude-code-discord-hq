<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 572" width="880" height="572" role="img" aria-labelledby="title desc" lang="pt-BR">
<title id="title">Como o claude-code-discord-hq funciona</title>
<desc id="desc">Você conversa com um servidor Discord pelo celular ou desktop. O discord-hq apply transforma o design.toml nos cargos, canais, permissões e webhooks do servidor. Em #table (papo) e #orders (fóruns), o bot (plugin oficial do Discord) leva suas mensagens à sessão garçom (tmux: waiter), que despacha o trabalho para as sessões de cozinha kitchen-a, kitchen-b e assim por diante (tmux + git worktrees). O discord-hq hook (em Notification e Stop) e o discord-hq watch (a cada 2 minutos) leem eventos do hook, telas do tmux, transcripts e manifestos da leva, e publicam por webhooks, sem token de bot, em #served, #alerts e #panel (o painel ao vivo). Eles também mostram uma notificação do macOS com o comando tmux attach no clipboard.</desc>
