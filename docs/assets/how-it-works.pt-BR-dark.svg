.e{fill:none;stroke:#6e7681;stroke-width:1.5;stroke-linejoin:round}
.sep{stroke:#3d444d}
.dot{fill:#fb923c}
.halo{fill:#fb923c;opacity:.25}
.hl{fill:none;stroke:#fb923c;stroke-width:2;stroke-linejoin:round}
